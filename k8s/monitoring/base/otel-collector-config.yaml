apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config

data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      zipkin:
        endpoint: 0.0.0.0:9411

    processors:
      batch:

    exporters:
      debug:
        verbosity: basic

      prometheus:
        endpoint: 0.0.0.0:8889

      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp, zipkin]
          processors: [batch]
          exporters: [debug, otlp/tempo]

        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus, debug]