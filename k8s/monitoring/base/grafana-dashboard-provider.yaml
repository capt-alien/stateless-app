apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider

data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: "stateless-app"
        orgId: 1
        folder: "Stateless App"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards