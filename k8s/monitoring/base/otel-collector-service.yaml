# File: k8s/monitoring/base/otel-collector-service.yaml

apiVersion: v1
kind: Service
metadata:
  name: otel-collector

spec:
  type: ClusterIP

  selector:
    app: otel-collector

  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317

    - name: otlp-http
      port: 4318
      targetPort: 4318

    - name: zipkin
      port: 9411
      targetPort: 9411

    - name: metrics
      port: 8889
      targetPort: 8889