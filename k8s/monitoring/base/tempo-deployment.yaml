apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: tempo

  template:
    metadata:
      labels:
        app: tempo

    spec:
      tolerations:
        - effect: NoSchedule
          key: kubernetes.io/arch
          operator: Equal
          value: arm64

      containers:
        - name: tempo
          image: grafana/tempo:2.6.1

          args:
            - "-config.file=/etc/tempo/tempo.yaml"

          ports:
            - name: http
              containerPort: 3200

            - name: otlp-grpc
              containerPort: 4317

            - name: otlp-http
              containerPort: 4318

          volumeMounts:
            - name: tempo-config
              mountPath: /etc/tempo

      volumes:
        - name: tempo-config
          configMap:
            name: tempo-config