apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:

      - job_name: "go-server"
        metrics_path: /metrics
        static_configs:
          - targets: ["go-server:8080"]

      - job_name: "swift-server"
        metrics_path: /metrics
        static_configs:
          - targets: ["swift-server:8081"]

      - job_name: "envoy"
        metrics_path: /stats/prometheus
        static_configs:
          - targets: ["envoy-admin:9901"]

      - job_name: "otel-collector"
        metrics_path: /metrics
        static_configs:
          - targets: ["otel-collector:8889"]